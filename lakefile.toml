name = "CircuitHdl"
version = "0.1.0"
testDriver = "CircuitHdlTest"
defaultTargets = ["CircuitHdl"]

# This package deliberately has no dependencies: it is built on core `Lean` and `BitVec`
# alone. Keep it that way -- it is what lets the whole thing build against a bare toolchain,
# with no Mathlib and no build cache.

[[lean_lib]]
name = "CircuitHdl"

[[lean_lib]]
name = "CircuitHdlTest"
