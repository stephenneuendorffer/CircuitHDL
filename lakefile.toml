name = "CircuitHdl"
version = "0.1.0"
testDriver = "CircuitHdlTest"
defaultTargets = ["CircuitHdl"]

# The language itself -- the AST, the width rules, the clock analysis, the surface syntax and
# the semantics -- is built on core `Lean` and `BitVec` alone, with no Mathlib and no build
# cache. Keep it that way: it is what lets the whole thing build against a bare toolchain.
#
# VeIR is the one dependency, and only `CircuitHdl.Circt` imports it. It supplies the CIRCT
# dialects (`hw`, `comb`, `seq`) that the backend lowers into, and the verifier that checks the
# result. Nothing else in the package may import it.

[[require]]
name = "VeIR"
path = "../veir"

[[lean_lib]]
name = "CircuitHdl"

[[lean_lib]]
name = "CircuitHdlTest"

# The quick subset, for iterating on the language rather than on a design: everything in the test
# tree that does not run a bounded refinement family. `lake build CircuitHdlQuick` is about a
# minute against roughly ten for `lake test`, and the header of `CircuitHdlQuick.lean` says which
# modules it leaves out and why that makes it unsafe as a substitute. `testDriver` is deliberately
# still `CircuitHdlTest`, so `lake test` means exactly what it meant before this target existed.
[[lean_lib]]
name = "CircuitHdlQuick"

# The arcilator cross-check generator. Writes build/arc/*.{mlir,expected}; scripts/arccheck.sh
# runs them through CIRCT's simulator and diffs. Deliberately *not* a test: it needs a CIRCT
# install, and `lake test` has to keep working against a bare toolchain.
[[lean_exe]]
name = "arccheck"
root = "ArcCheck"
